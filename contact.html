            <div class="md:col-6 border border-primary p-10">
              <h2>Contact Form</h2>
              <form class="row">
                <div class="md:col-6">
                  <label for="exampleFormControlInput"
                    class="form-label mb-2">Enter name</label>
                  <input type="text" class="form-control"
                    id="exampleFormControlInput" placeholder="Enter name">

                </div>
                <div class="md:col-6">
                  <label for="exampleFormControlInput"

                </div>
                <div class="md:col-6">
                  <label for="exampleFormControlInput"
                    class="form-label mb-2">Enter Phone</label>
                  <input type="numer" class="form-control"
                    id="exampleFormControlInput" placeholder="Enter Number">

                </div>
                <div class="md:col-6">
                  <label for="exampleFormControlInput"
                    class="form-label mb-2">Enter Adhar</label>
                  <input type="number" class="form-control"
                    id="exampleFormControlInput" placeholder="Enter adhar">

                </div>
                <div class="md:col-4">
                  <div class="form-field">
                    <label for="exampleFormControlSelect2"
                      class="form-label">Example Country</label>
                    <select class="form-control" id="exampleFormControlSelect2">
                      <option>Choose one…</option>
                      <option value="1">India</option>
                      <option value="2">US</option>
                      <option value="3">UK</option>
                    </select>
                  </div>
                </div>
                <div class="md:col-4">
                  <div class="form-field">
                    <label for="exampleFormControlSelect2"
                      class="form-label">Example State</label>
                    <select class="form-control" id="exampleFormControlSelect2">
                      <option>Choose one…</option>
                      <option value="1">Maharashtra</option>
                      <option value="2">Karnataka</option>
                      <option value="3">Delhi</option>
                    </select>
                  </div>
                </div>
                <div class="md:col-4">
                  <div class="form-field">
                    <label for="exampleFormControlSelect2"
                      class="form-label">Example City</label>
                    <select class="form-control" id="exampleFormControlSelect2">
                      <option>Choose one…</option>
                      <option value="1">Mumbai</option>
                      <option value="2">Pune</option>
                      <option value="3">Nashik</option>
                    </select>
                  </div>
                </div>
                <div class="md:col-12 mb-10">
                  <div class="form-field">
                    <label for="exampleFormControlTextarea2"
                      class="form-label">Enter Comment</label>
                    <textarea class="form-control"
                      id="exampleFormControlTextarea2" rows="4"></textarea>
                  </div>
                </div>
                <button class="btn-solid theme-primary justify-self-start"
                  type="submit">Submit form</button>
